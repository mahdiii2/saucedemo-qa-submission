name: Fresh machine verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record fresh environment
        run: |
          export npm_config_cache="$RUNNER_TEMP/saucedemo-npm-cache"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/saucedemo-browsers"
          printf 'npm_config_cache=%s\n' "$npm_config_cache" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir ci-evidence
          test ! -e "$npm_config_cache"
          test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          mkdir "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"
          {
            date --iso-8601=seconds
            cat /etc/os-release
            uname -a
            node --version
            npm --version
            git rev-parse HEAD
            echo "npm cache initially empty: $(find "$npm_config_cache" -type f | wc -l) files"
            echo "browser cache initially empty: $(find "$PLAYWRIGHT_BROWSERS_PATH" -type f | wc -l) files"
            echo "Runner image: $ImageOS $ImageVersion"
          } | tee ci-evidence/environment.txt
          git ls-files -z | xargs -0 sha256sum > ci-evidence/source-sha256.txt
      - name: Install dependencies
        id: install
        run: bash .github/scripts/run-stage.sh 01-install npm ci
      - name: Install all browsers and OS dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 02-browsers npx playwright install --with-deps
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 03-typecheck npm run typecheck
      - name: Core suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 04-core npm test
      - name: Three repeats
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 05-repeats npm test -- --repeat-each=3
      - name: Headed suite under virtual display
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 06-headed xvfb-run -a npm run test:headed -- --trace=on
      - name: Open and inspect HTML report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/scripts/run-stage.sh 07-report node .github/scripts/check-report.mjs
      - name: Confirm source was not modified
        if: ${{ !cancelled() }}
        run: git diff --exit-code && sha256sum --check ci-evidence/source-sha256.txt > ci-evidence/source-integrity.txt
      - name: Upload evidence even when a check fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-machine-evidence-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
